<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Age distribution — Australian Speeding Analysis</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/visualisations.css">
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body data-page="q2">
  <div class="container">
    <header class="header-navy">
      <div class="brand">
        <a href="index.html" class="home-link" aria-label="Home">
          <img src="home.svg" alt="Home" class="nav-home" style="width:200px;height:50px;object-fit:contain;" />
        </a>
        <div>
          <div class="brand-title">Australian Speeding Analysis</div>
        </div>
      </div>
      <nav>
        <a href="index.html">Home</a>
        <a href="questions.html">Questions</a>
        <a href="about.html">About Us</a>
      </nav>
    </header>

    <div class="main">
      <aside class="sidebar">
        <h3>Filters</h3>
        <div class="control">
          <label>Jurisdiction</label>
          <select id="jurisdiction">
            <option value="all">All states & territories</option>
          </select>
        </div>
        <div class="control">
          <label>Year</label>
          <input id="yearRange" type="range" min="2008" max="2024" value="2016" />
          <div class="muted">Selected year: <span id="yr">2016</span></div>
        </div>
        <div class="control">
          <label>Detection method</label>
          <select multiple id="detection" class="multiselect"></select>
        </div>
        <div class="control">
          <label>Location type</label>
          <select id="locType"><option>All</option></select>
        </div>
        <div class="actions">
          <button class="btn" id="reset">Reset filters</button>
          <button class="btn" id="share">Share view</button>
        </div>
      </aside>

      <main class="dash">
        <div class="title">
          <h1>Age group distribution</h1>
          <div class="subtitle">Which age groups receive the most fines?</div>
        </div>

        <div class="visuals">
          <section class="panel small">
            <div class="panel-title">Age group distribution</div>
            <div id="ageBar" class="chart-area">Loading age distribution...</div>
          </section>
        </div>

      </main>

    <footer>
      <div>© 2025 Australian Speeding Analysis</div>
      <div class="footer-sub">Interactive prototype — D3 + HTML/CSS + KNIME</div>
    </footer>
  </div>

  <script src="js/main.js"></script>
  <script src="js/d3_charts.js"></script>
</body>
</html>
